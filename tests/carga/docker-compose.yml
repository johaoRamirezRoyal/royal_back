# Pruebas de carga con k6: InfluxDB guarda las métricas y Grafana las muestra en vivo.
#   docker compose -f tests/carga/docker-compose.yml up -d
#   Grafana: http://localhost:3000 (sin login, panel «k6 — OMNIA»)
# Solo para pruebas locales: Grafana va sin contraseña.
services:
  influxdb:
    image: influxdb:1.8-alpine
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_AUTH_ENABLED=false

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/k6.json
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./grafana/k6.json:/var/lib/grafana/dashboards/k6.json
    depends_on:
      - influxdb
